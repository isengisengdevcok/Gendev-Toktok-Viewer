name: Build GENDEV TikTok Viewer APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build Debug/Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -startdate 2020/01/01 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          rm -f ci-debug.keystore
          keytool -genkeypair -noprompt \
            -keystore ci-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -startdate 2020/01/01 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=GENDEV Debug,O=GENDEV,C=US"

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f my-upload-key.jks
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -startdate 2020/01/01 \
              -validity 10000 \
              -storepass gendevci123 \
              -keypass gendevci123 \
              -dname "CN=GENDEV Release, OU=Mobile, O=GENDEV, L=Local, ST=NA, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=gendevci123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=gendevci123" >> $GITHUB_ENV
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Zipalign, Sign (v1+v2+v3) & Verify APKs
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          mkdir -p release-assets
          RAW_DEBUG=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          RAW_RELEASE=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)

          "$ZIPALIGN" -p -f 4 "$RAW_DEBUG" release-assets/gendev-tiktok-viewer-debug.apk
          "$ZIPALIGN" -p -f 4 "$RAW_RELEASE" release-assets/gendev-tiktok-viewer-release.apk

          "$APKSIGNER" sign \
            --ks ci-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            release-assets/gendev-tiktok-viewer-debug.apk

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias upload \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            release-assets/gendev-tiktok-viewer-release.apk

          "$APKSIGNER" verify --verbose --print-certs release-assets/gendev-tiktok-viewer-debug.apk
          "$APKSIGNER" verify --verbose --print-certs release-assets/gendev-tiktok-viewer-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gendev-tiktok-viewer-debug-apk
          path: release-assets/gendev-tiktok-viewer-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gendev-tiktok-viewer-release-apk
          path: release-assets/gendev-tiktok-viewer-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0-build.${{ github.run_number }}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.apk --clobber
          else
            gh release create "$TAG" release-assets/*.apk \
              --target "${{ github.sha }}" \
              --title "GENDEV TikTok Viewer ($TAG)" \
              --notes "Signed & verified (v1+v2+v3) Debug and Release APKs ready to install." \
              --latest
          fi
